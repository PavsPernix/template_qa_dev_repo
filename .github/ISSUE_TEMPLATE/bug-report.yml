name: "Bug Report"
description: "Report a bug found during testing or usage"
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Please provide as much detail as possible to help reproduce and fix the bug.

  - type: input
    id: related-issue
    attributes:
      label: Related User Story / Test Case
      description: "Reference the related issue (e.g., #8 or #10)"
      placeholder: "#"
    validations:
      required: false

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: "A clear and concise description of what the bug is"
      placeholder: "Describe the bug..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: "Step-by-step instructions to reproduce the bug"
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: "What you expected to happen"
      placeholder: "Describe what should have happened..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: "What actually happened"
      placeholder: "Describe what actually happened..."
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: "How severe is this bug?"
      options:
        - Critical - System crash, data loss, security vulnerability
        - High - Major feature broken, no workaround
        - Medium - Feature partially broken, workaround exists
        - Low - Minor issue, cosmetic, edge case
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Where did this bug occur?"
      value: |
        - **OS**:
        - **Browser**:
        - **Device**:
        - **App Version**:
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Evidence
      description: "Add screenshots, screen recordings, or other evidence"
      placeholder: "Drag and drop images here or paste links"
    validations:
      required: false

  - type: textarea
    id: console-logs
    attributes:
      label: Console / Logs
      description: "Paste any relevant console output or log entries"
      render: shell
    validations:
      required: false
